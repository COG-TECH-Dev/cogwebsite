services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Set to your real domain in .env once DNS points at this server —
      # Caddy then requests and renews a Let's Encrypt cert automatically.
      # Left as "localhost" it just serves plain HTTP for local testing.
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URI: postgresql://payload:payload@postgres:5432/cogwebsite
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media:/app/media

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: cogwebsite
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d cogwebsite']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
