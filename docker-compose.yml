services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URI: postgresql://payload:payload@postgres:5432/cogwebsite
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media:/app/media

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: cogwebsite
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d cogwebsite']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  media:
