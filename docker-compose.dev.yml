services:
  app:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URI: postgresql://payload:payload@postgres:5432/cogwebsite
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: cogwebsite
    ports:
      - '5432:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d cogwebsite']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
  node_modules:
  next_cache:
