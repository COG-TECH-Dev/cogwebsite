name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: cogwebsite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URI: postgresql://payload:payload@localhost:5432/cogwebsite
      PAYLOAD_SECRET: ci-secret-not-for-production
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run generate:types

      # Confirms the committed migrations apply cleanly to a fresh database
      # before the build (which itself queries the DB during static
      # generation) — catches a migration that only worked against a
      # developer's already-migrated local database.
      - run: npm run migrate
        env:
          NODE_ENV: production

      - run: npm run build
